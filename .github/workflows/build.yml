name: Build APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
      
    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Dar permisos a los wrappers
      run: |
        chmod +x app_oyente/gradlew
        chmod +x app_transmisor/gradlew
        
    - name: Compilar App Oyente
      run: |
        cd app_oyente
        ./gradlew assembleDebug
        
    - name: Compilar App Transmisor
      run: |
        cd app_transmisor
        ./gradlew assembleDebug
        
    - name: Subir APK Oyente
      uses: actions/upload-artifact@v4
      with:
        name: RadioOyente-APK
        path: app_oyente/app/build/outputs/apk/debug/app-debug.apk
        
    - name: Subir APK Transmisor
      uses: actions/upload-artifact@v4
      with:
        name: RadioTransmisor-APK
        path: app_transmisor/app/build/outputs/apk/debug/app-debug.apk
